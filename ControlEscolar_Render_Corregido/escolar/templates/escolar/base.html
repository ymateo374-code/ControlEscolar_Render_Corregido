<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6f9; }
        .sidebar { min-height:100vh; background:#17223b; }
        .sidebar a { color:#dce3f0; text-decoration:none; display:block; padding:12px 18px; border-radius:10px; margin:4px 8px; }
        .sidebar a:hover { background:#25345a; color:white; }
        .brand { color:white; font-weight:700; font-size:1.2rem; padding:22px 18px; }
        .card-stat { border:0; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
        .page-card { border:0; border-radius:18px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
        .btn { border-radius:10px; }
        .table thead th { background:#17223b; color:white; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-lg-2 col-md-3 sidebar p-0">
            <div class="brand">Control Escolar</div>
            <a href="{% url 'dashboard' %}">Inicio</a>
            <a href="{% url 'carrera_lista' %}">Carreras</a>
            <a href="{% url 'profesor_lista' %}">Profesores</a>
            <a href="{% url 'estudiante_lista' %}">Estudiantes</a>
            <a href="{% url 'materia_lista' %}">Materias</a>
            <a href="{% url 'aula_lista' %}">Aulas</a>
            <a href="{% url 'periodo_lista' %}">Periodos</a>
            <a href="{% url 'horario_lista' %}">Horarios</a>
            <a href="{% url 'grupo_lista' %}">Grupos</a>
            <a href="{% url 'calificacion_lista' %}">Calificaciones</a>
        </nav>

        <main class="col-lg-10 col-md-9 p-4">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
