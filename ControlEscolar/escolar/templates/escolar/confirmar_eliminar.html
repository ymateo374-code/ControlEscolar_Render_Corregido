{% extends 'escolar/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card page-card text-center">
            <div class="card-body p-5">
                <h2 class="text-danger fw-bold">{{ titulo }}</h2>
                <p class="fs-5 mt-3">¿Estás seguro de eliminar este registro?</p>
                <p class="text-muted">{{ object }}</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url volver_url %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
